<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deep Notebook</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 18px/1.6 system-ui, sans-serif; background: #f6f5ff; color: #17162b; }
    main { width: min(640px, calc(100% - 40px)); padding: 40px; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px #1b1a4a22; }
    img { width: 96px; height: 96px; }
    h1 { margin: 18px 0 8px; font-size: 34px; letter-spacing: -0.02em; }
    p { margin: 0 0 18px; color: #5a5875; }
    code { padding: 2px 6px; border-radius: 6px; background: #efedff; color: #3026a8; }
    a { color: #3026a8; }
    @media (prefers-color-scheme: dark) {
      body { background: #11101d; color: #f1efff; }
      main { background: #1c1a2e; box-shadow: 0 20px 60px #0008; }
      p { color: #b6b2d6; }
      code { background: #2c2950; color: #c9c4ff; }
      a { color: #b9b2ff; }
    }
  </style>
</head>
<body>
  <main>
    <img src="market/icons/deep-notebook.svg" alt="Deep Notebook icon">
    <h1>Deep Notebook</h1>
    <p>An AI-native study notebook for DeepSeek Harness. Every lesson, quiz, plan, and chat is a real Harness session, with course style, clickable quizzes, learner memory, and manual lesson completion.</p>
    <p>Plugin index: <code>market/index.json</code></p>
    <p><a href="https://github.com/MicroCapCap/dsh-deep-notebook">Source and releases on GitHub</a></p>
  </main>
</body>
</html>
